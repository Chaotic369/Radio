<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analogue Hi-Fi Master Radio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #08090d;
            --chassis-bg: #14171e;
            --chassis-metal: linear-gradient(180deg, #1f242d 0%, #151820 60%, #101318 100%);
            --bezel-color: #262c37;
            --amber-glow: #ff9f2c;
            --amber-dim: #995510;
            --amber-bright: #ffc477;
            --cyan-streak: #2ce8ff;
            --cyan-flare: rgba(44, 232, 255, 0.65);
            --text-color: #dce3ed;
            --text-light: #7c889d;
            --text-dim: #454f60;
            --meter-glass: #0b0e14;
            --shadow-outer: 0 30px 60px -15px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.06);
            --shadow-inner: inset 3px 3px 6px rgba(0, 0, 0, 0.8), inset -1px -1px 3px rgba(255, 255, 255, 0.05);
            --knob-metal: radial-gradient(circle at 35% 35%, #343a46 0%, #171a22 75%, #0f1117 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(255, 159, 44, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(44, 232, 255, 0.04) 0%, transparent 60%),
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0px, rgba(255, 255, 255, 0.012) 1px, transparent 1px, transparent 2px);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--chassis-metal);
            border-radius: 20px;
            border: 1px solid var(--bezel-color);
            box-shadow: var(--shadow-outer);
            padding: 22px 24px 26px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: relative;
        }

        /* Analogue Chassis Screws and Labels */
        .chassis-screws {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .chassis-brand span {
            color: var(--amber-glow);
            font-weight: 700;
        }

        .screw {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: radial-gradient(circle, #3e4655 0%, #151820 100%);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25), 0 1px 3px rgba(0,0,0,0.8);
            position: relative;
            border: 1px solid #0d0f14;
        }

        .screw::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 2px;
            right: 2px;
            height: 1px;
            background: #0d0f14;
            transform: translateY(-50%) rotate(42deg);
        }

        /* Anamorphic Tuner Display Section */
        .tuner-display {
            background: var(--meter-glass);
            border-radius: 14px;
            border: 1px solid #1c222e;
            box-shadow: inset 0 3px 12px rgba(0, 0, 0, 0.95), 0 1px 0 rgba(255, 255, 255, 0.07);
            padding: 14px 16px 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Anamorphic Lens Flare & Reflections */
        .anamorphic-flare {
            position: absolute;
            top: 48%;
            left: -30%;
            width: 160%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(44, 232, 255, 0) 15%, 
                var(--cyan-flare) 44%, 
                #ffffff 50%, 
                var(--amber-glow) 56%, 
                rgba(255, 159, 44, 0) 85%, 
                transparent 100%
            );
            box-shadow: 0 0 10px 2px var(--cyan-streak), 0 0 20px 4px var(--amber-glow);
            opacity: 0.6;
            pointer-events: none;
            mix-blend-mode: screen;
            transform: translateY(-50%);
            animation: flareDrift 6s ease-in-out infinite alternate;
            z-index: 5;
        }

        @keyframes flareDrift {
            0% { opacity: 0.4; filter: blur(0.5px); }
            50% { opacity: 0.8; filter: blur(0.2px); }
            100% { opacity: 0.5; filter: blur(0.8px); }
        }

        .glass-reflection {
            position: absolute;
            inset: 0;
            background: linear-gradient(125deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 30%, transparent 60%);
            pointer-events: none;
            z-index: 6;
        }

        .tuner-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            position: relative;
            z-index: 2;
        }

        .analogue-indicators {
            display: flex;
            gap: 12px;
        }

        .indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        .indicator i {
            font-size: 7px;
            color: #272d3b;
            transition: all 0.3s ease;
        }

        .indicator.active {
            color: var(--amber-glow);
            text-shadow: 0 0 8px rgba(255, 159, 44, 0.7);
        }

        .indicator.active i {
            color: var(--amber-glow);
            box-shadow: 0 0 8px var(--amber-glow);
        }

        /* Dual Analogue VU Meters */
        .vu-meters-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            position: relative;
            z-index: 2;
        }

        .vu-meter {
            background: #07090d;
            border-radius: 8px;
            padding: 8px 6px 4px;
            border: 1px solid #161b24;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .vu-scale {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-family: 'Share Tech Mono', monospace;
            font-size: 8px;
            color: #5d677a;
            padding: 0 4px;
            letter-spacing: -0.5px;
        }

        .vu-scale .vu-red {
            color: #e53e3e;
            font-weight: bold;
        }

        .vu-dial {
            width: 100%;
            height: 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .vu-needle {
            position: absolute;
            bottom: -6px;
            width: 2px;
            height: 38px;
            background: linear-gradient(180deg, #ff4c4c 0%, #ff9f2c 60%, #4a5568 100%);
            box-shadow: 0 0 5px rgba(255, 76, 76, 0.6);
            transform-origin: bottom center;
            transform: rotate(-32deg);
            transition: transform 0.08s cubic-bezier(0.2, 0.9, 0.3, 1);
            border-radius: 1px;
        }

        .vu-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 8px;
            letter-spacing: 1px;
            color: var(--amber-dim);
            margin-top: 2px;
        }

        /* Frequency Scale */
        .frequency-scale {
            background: #05070a;
            border: 1px solid #161a23;
            border-radius: 6px;
            padding: 6px 10px;
            position: relative;
            z-index: 2;
        }

        .scale-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            color: #6d7b91;
            letter-spacing: 1px;
        }

        .band-tag {
            color: var(--amber-glow);
            font-weight: bold;
            font-size: 10px;
        }

        .band-unit {
            color: var(--text-dim);
            font-size: 8px;
        }

        .scale-track {
            position: relative;
            height: 14px;
            margin: 4px 0;
            background: repeating-linear-gradient(90deg, #2a3342 0px, #2a3342 1px, transparent 1px, transparent 10px);
            border-top: 1px solid #1b222d;
            border-bottom: 1px solid #1b222d;
        }

        .needle-indicator {
            position: absolute;
            top: -2px;
            left: 45%;
            width: 3px;
            height: 18px;
            background: #ff3333;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.9), 0 0 20px rgba(255, 159, 44, 0.6);
            border-radius: 1px;
            transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 3;
        }

        /* Display Readout */
        .now-playing {
            text-align: center;
            width: 100%;
        }

        .display-amber-glow h3 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--amber-bright);
            text-shadow: 0 0 14px rgba(255, 159, 44, 0.55), 0 0 2px rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .display-amber-glow p {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--text-light);
            text-transform: uppercase;
        }

        /* Search Section */
        .search-box {
            display: flex;
            align-items: center;
            background: #0c0e14;
            border-radius: 12px;
            border: 1px solid #202735;
            box-shadow: var(--shadow-inner);
            padding: 4px 12px;
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 6px;
            font-size: 13px;
            font-family: 'Share Tech Mono', monospace;
            color: var(--text-color);
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--text-dim);
        }

        .search-box button {
            background: transparent;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: 8px 10px;
            font-size: 14px;
            transition: all 0.25s ease;
        }

        .search-box button:hover {
            color: var(--amber-glow);
            text-shadow: 0 0 10px var(--amber-glow);
        }

        /* Results Section */
        .results-container {
            height: 160px;
            overflow-y: auto;
            border-radius: 12px;
            padding: 8px;
            background: #090b10;
            border: 1px solid #191e28;
            box-shadow: var(--shadow-inner);
        }

        .results-container::-webkit-scrollbar {
            width: 5px;
        }
        .results-container::-webkit-scrollbar-track {
            background: #0b0d13;
        }
        .results-container::-webkit-scrollbar-thumb {
            background: #252c3a;
            border-radius: 10px;
        }
        .results-container::-webkit-scrollbar-thumb:hover {
            background: var(--amber-dim);
        }

        .station-item {
            padding: 10px 12px;
            margin-bottom: 7px;
            border-radius: 8px;
            background: #11141b;
            border: 1px solid #1a202c;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .station-item:hover {
            background: #171b24;
            border-color: #2a3447;
            transform: translateY(-1px);
        }

        .station-item.active {
            background: #1c212c;
            border-color: var(--amber-glow);
            box-shadow: inset 0 0 10px rgba(255, 159, 44, 0.15), 0 0 12px rgba(255, 159, 44, 0.2);
        }

        .station-item.active .station-name {
            color: var(--amber-bright);
            text-shadow: 0 0 8px rgba(255, 159, 44, 0.5);
        }

        .station-icon {
            font-size: 13px;
            color: var(--amber-glow);
        }

        .station-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .station-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .station-tags {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: var(--text-dim);
        }

        /* Player Section & Analogue Controls */
        .player-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .btn {
            background: var(--knob-metal);
            border: 1px solid #323a48;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--text-color);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.75), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
            outline: none;
            position: relative;
        }

        .btn:active {
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.8), inset 0 3px 6px rgba(0, 0, 0, 0.9);
            transform: translateY(2px);
        }

        .btn-play {
            width: 72px;
            height: 72px;
            font-size: 22px;
            color: var(--amber-glow);
            border: 2px solid #364152;
        }

        .btn-play:hover {
            color: var(--amber-bright);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 159, 44, 0.35);
        }

        .btn-play.playing {
            color: var(--amber-bright);
            border-color: var(--amber-glow);
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.9), 0 0 22px rgba(255, 159, 44, 0.55);
        }

        .btn-record {
            width: 52px;
            height: 52px;
            font-size: 14px;
            color: var(--text-dim);
            gap: 2px;
        }

        .btn-micro-label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 8px;
            letter-spacing: 0.5px;
            color: var(--text-dim);
        }

        .btn-record.recording {
            color: #ff3b3b;
            border-color: #e53e3e;
            box-shadow: inset 0 0 12px rgba(255, 59, 59, 0.7), 0 0 18px rgba(255, 59, 59, 0.7);
            animation: pulse 1.4s infinite alternate;
        }

        .btn-record.recording .btn-micro-label {
            color: #ff4c4c;
        }

        @keyframes pulse {
            0% { transform: scale(0.96); box-shadow: 0 0 10px rgba(255, 59, 59, 0.5); }
            100% { transform: scale(1.02); box-shadow: 0 0 24px rgba(255, 59, 59, 0.85); }
        }

        /* Volume Control Styled as Analogue Fader */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 6px 14px;
            background: #090c10;
            border-radius: 12px;
            border: 1px solid #1a202b;
            box-shadow: var(--shadow-inner);
        }

        .volume-container i {
            color: var(--text-dim);
            font-size: 13px;
        }

        .db-mark {
            font-family: 'Share Tech Mono', monospace;
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe2b3 0%, #ff9f2c 60%, #b36200 100%);
            border: 1px solid #331800;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 0 12px rgba(255, 159, 44, 0.7), 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: linear-gradient(90deg, #18202d 0%, #ff9f2c 100%);
            border-radius: 3px;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.9);
        }

        /* Loading Spinner */
        .loader {
            display: none;
            border: 3px solid #1b212c;
            border-top: 3px solid var(--amber-glow);
            border-radius: 50%;
            width: 22px;
            height: 22px;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            color: #ff5c5c;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            text-align: center;
            display: none;
            letter-spacing: 0.5px;
        }
</head>
<body>

    <div class="app-container">
        <!-- Analogue Chassis Bezel & Screws -->
        <div class="chassis-screws">
            <span class="screw"></span>
            <span class="chassis-brand">ANALOGUE ACOUSTICS <span>MODEL MK-IV</span></span>
            <span class="screw"></span>
        </div>

        <!-- Anamorphic Analogue Tuner & VU Section -->
        <div class="tuner-display">
            <div class="anamorphic-flare"></div>
            <div class="glass-reflection"></div>

            <div class="tuner-top-row">
                <span>FM / AM STEREO RECEIVER</span>
                <div class="analogue-indicators">
                    <span class="indicator" id="tuneInd"><i class="fas fa-circle"></i> TUNED</span>
                    <span class="indicator" id="stereoInd"><i class="fas fa-circle"></i> STEREO</span>
                </div>
            </div>

            <!-- Analogue VU Meters -->
            <div class="vu-meters-container">
                <div class="vu-meter">
                    <div class="vu-scale">
                        <span>-20</span><span>-10</span><span>-5</span><span>-3</span><span>0</span><span class="vu-red">+3</span>
                    </div>
                    <div class="vu-dial">
                        <div class="vu-needle" id="vuNeedleL"></div>
                    </div>
                    <div class="vu-label">SIGNAL L (dB)</div>
                </div>
                <div class="vu-meter">
                    <div class="vu-scale">
                        <span>-20</span><span>-10</span><span>-5</span><span>-3</span><span>0</span><span class="vu-red">+3</span>
                    </div>
                    <div class="vu-dial">
                        <div class="vu-needle" id="vuNeedleR"></div>
                    </div>
                    <div class="vu-label">SIGNAL R (dB)</div>
                </div>
            </div>

            <!-- Analogue Frequency Scale with Needle -->
            <div class="frequency-scale">
                <div class="scale-row">
                    <span class="band-tag">FM</span>
                    <span>88 • 92 • 96 • 100 • 104 • 108</span>
                    <span class="band-unit">MHz</span>
                </div>
                <div class="scale-track">
                    <div class="needle-indicator" id="dialNeedle"></div>
                </div>
                <div class="scale-row">
                    <span class="band-tag">AM</span>
                    <span>540 • 700 • 900 • 1200 • 1600</span>
                    <span class="band-unit">kHz</span>
                </div>
            </div>
        </div>

        <!-- Station Info / Status Display -->
        <div class="now-playing">
            <div class="display-amber-glow">
                <h3 id="stationTitle">No Station Selected</h3>
                <p id="stationStatus">Ready to tune</p>
            </div>
        </div>

        <p class="error-msg" id="errorMsg">Failed to load stream. Try another frequency.</p>

        <!-- Search Box -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search band / station..." oninput="handleSearchInput()">
            <button onclick="searchStations()" title="Scan Frequency">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <!-- Station Results Presets -->
        <div class="results-container" id="resultsContainer">
            <div style="text-align: center; color: var(--text-light); padding-top: 60px; font-size: 13px; font-family: 'Share Tech Mono', monospace;">
                [ SCAN TO FIND STATIONS GLOBALLY ]
            </div>
        </div>

        <!-- Analogue Transport Controls & Volume -->
        <div class="player-section">
            <div class="controls">
                <button class="btn btn-record" id="recordBtn" onclick="toggleRecord()" title="Tape Record">
                    <i class="fas fa-circle" id="recordIcon"></i>
                    <span class="btn-micro-label">REC</span>
                </button>
                <div class="loader" id="loader"></div>
                <button class="btn btn-play" id="playBtn" onclick="togglePlay()" title="Master Power / Play">
                    <i class="fas fa-play" id="playIcon"></i>
                </button>
            </div>

            <div class="volume-container">
                <span class="db-mark">-∞</span>
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.5" onchange="setVolume(this.value)">
                <i class="fas fa-volume-up"></i>
                <span class="db-mark">0dB</span>
            </div>
        </div>

        <div class="chassis-screws">
            <span class="screw"></span>
            <span>SOLID STATE RECEIVER • HI-FIDELITY</span>
            <span class="screw"></span>
        </div>
    </div>

    <audio id="audioPlayer" preload="none"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const stationTitle = document.getElementById('stationTitle');
        const stationStatus = document.getElementById('stationStatus');
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('errorMsg');
                const recordBtn = document.getElementById('recordBtn');
        
                let isPlaying = false;
                let currentStation = null;
                let searchTimeout;
                let mediaRecorder;
                let recordedChunks = [];
                let isRecording = false;

                // Set initial volume
                audio.volume = 0.5;

                // Analogue VU Meter & Dial Needle Dynamics
                let vuAnimId;
                function updateDialNeedle(name) {
                    const needle = document.getElementById('dialNeedle');
                    if (!needle) return;
                    let hash = 0;
                    for (let i = 0; i < (name || '').length; i++) hash = (hash * 31 + name.charCodeAt(i)) % 100;
                    const pct = 10 + (hash % 80);
                    needle.style.left = pct + '%';
                }

                function startVuMeter() {
                    const nL = document.getElementById('vuNeedleL');
                    const nR = document.getElementById('vuNeedleR');
                    const tInd = document.getElementById('tuneInd');
                    const sInd = document.getElementById('stereoInd');
                    if (tInd) tInd.classList.add('active');
                    if (sInd) sInd.classList.add('active');

                    function tick() {
                        if (audio.paused) return;
                        const vL = -26 + Math.random() * 30 + (Math.sin(Date.now() / 140) * 8);
                        const vR = -26 + Math.random() * 32 + (Math.cos(Date.now() / 130) * 8);
                        if (nL) nL.style.transform = `rotate(${Math.min(22, Math.max(-35, vL))}deg)`;
                        if (nR) nR.style.transform = `rotate(${Math.min(22, Math.max(-35, vR))}deg)`;
                        vuAnimId = requestAnimationFrame(tick);
                    }
                    cancelAnimationFrame(vuAnimId);
                    tick();
                }

                function stopVuMeter() {
                    cancelAnimationFrame(vuAnimId);
                    const nL = document.getElementById('vuNeedleL');
                    const nR = document.getElementById('vuNeedleR');
                    const tInd = document.getElementById('tuneInd');
                    const sInd = document.getElementById('stereoInd');
                    if (nL) nL.style.transform = 'rotate(-35deg)';
                    if (nR) nR.style.transform = 'rotate(-35deg)';
                    if (tInd) tInd.classList.remove('active');
                    if (sInd) sInd.classList.remove('active');
                }

                audio.addEventListener('play', () => {
                    startVuMeter();
                    updateDialNeedle(stationTitle.textContent);
                });
                audio.addEventListener('pause', stopVuMeter);
                audio.addEventListener('ended', stopVuMeter);
                audio.addEventListener('error', stopVuMeter);
                // API Endpoint for Radio Browser
                const API_BASE = 'https://de1.api.radio-browser.info/json/stations/search?limit=15&hidebroken=true&name=';

                const recommendations = [
                    { name: "Dance Wave", url_resolved: "http://dancewave.online/dance.mp3", country: "Global", tags: "dance, pop" },
                    { name: "Lofi Hip Hop", url_resolved: "http://stream.zeno.fm/f3wvbbqmdg8uv", country: "Global", tags: "lofi, chill" },
                    { name: "Classic Rock Florida", url_resolved: "http://198.58.98.83:8258/stream", country: "USA", tags: "classic rock" },
                    { name: "Smooth Jazz", url_resolved: "http://uk1.internet-radio.com:8294/stream", country: "UK", tags: "jazz, smooth" }
                ];

                window.onload = () => {
                    showRecommendations();
                };

                function showRecommendations() {
                    resultsContainer.innerHTML = '<div style="text-align: center; color: var(--text-light); padding: 10px; font-size: 14px; font-weight: bold; margin-bottom: 10px;">Recommended Stations</div>';
                    recommendations.forEach(station => {
                        const div = document.createElement('div');
                        div.className = 'station-item';
                        div.innerHTML = `
                            <div class="station-icon"><i class="fas fa-star"></i></div>
                            <div class="station-info">
                                <span class="station-name">${station.name}</span>
                                <span class="station-tags">${station.country} • ${station.tags}</span>
                            </div>
                        `;
                        div.onclick = () => loadAndPlayStation(station, div);
                        resultsContainer.appendChild(div);
                    });
                }

                function handleSearchInput() {
                    const query = searchInput.value.trim();
                    clearTimeout(searchTimeout);
            
                    if (query === '') {
                        showRecommendations();
                        return;
                    }
            
                    searchTimeout = setTimeout(() => {
                        searchStations(query);
                    }, 500); // 500ms debounce
                }

                async function searchStations(queryStr) {
                    const query = queryStr || searchInput.value.trim();
                    if (!query) {
                        showRecommendations();
                        return;
                    }

                    resultsContainer.innerHTML = '<div style="text-align: center; color: var(--text-light); padding-top: 70px; font-size: 14px;">Searching...</div>';

            try {
                const response = await fetch(API_BASE + encodeURIComponent(query));
                const data = await response.json();

                if (data.length === 0) {
                    resultsContainer.innerHTML = '<div style="text-align: center; color: var(--text-light); padding-top: 70px; font-size: 14px;">No stations found.</div>';
                    return;
                }

                resultsContainer.innerHTML = '';
                data.forEach(station => {
                    const div = document.createElement('div');
                    div.className = 'station-item';
                    
                    const tags = station.tags ? station.tags.split(',').slice(0, 2).join(', ') : 'Web Radio';
                    
                    div.innerHTML = `
                        <div class="station-icon"><i class="fas fa-broadcast-tower"></i></div>
                        <div class="station-info">
                            <span class="station-name">${station.name}</span>
                            <span class="station-tags">${station.country || 'Unknown'} • ${tags}</span>
                        </div>
                    `;
                    
                    div.onclick = () => loadAndPlayStation(station, div);
                    resultsContainer.appendChild(div);
                });

            } catch (error) {
                resultsContainer.innerHTML = '<div style="text-align: center; color: #e53e3e; padding-top: 70px; font-size: 14px;">Error fetching stations.</div>';
            }
        }

        function loadAndPlayStation(station, element) {
            // Update active state in UI
            document.querySelectorAll('.station-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            currentStation = station;
            stationTitle.textContent = station.name;
            errorMsg.style.display = 'none';
            
            // Set audio source
            audio.src = station.url_resolved;
            
            playAudio();
        }

        function togglePlay() {
            if (!currentStation && !audio.src) {
                alert("Please select a radio station first!");
                return;
            }

            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        }

        function playAudio() {
            stationStatus.textContent = "Buffering...";
            playIcon.style.display = 'none';
            loader.style.display = 'block';
            
            audio.play().then(() => {
                isPlaying = true;
                playIcon.className = 'fas fa-pause';
                playIcon.style.display = 'block';
                loader.style.display = 'none';
                playBtn.classList.add('playing');
                stationStatus.textContent = "Now Playing";
                errorMsg.style.display = 'none';
            }).catch(error => {
                console.error("Playback failed", error);
                isPlaying = false;
                playIcon.className = 'fas fa-play';
                playIcon.style.display = 'block';
                loader.style.display = 'none';
                playBtn.classList.remove('playing');
                stationStatus.textContent = "Error";
                errorMsg.style.display = 'block';
            });
        }

        function pauseAudio() {
            audio.pause();
            isPlaying = false;
            playIcon.className = 'fas fa-play';
            playBtn.classList.remove('playing');
            stationStatus.textContent = "Paused";
        }

        function setVolume(val) {
            audio.volume = val;
        }

        // Handle stream ending or errors abruptly
                audio.addEventListener('error', () => {
                    pauseAudio();
                    stationStatus.textContent = "Stream Offline";
                    errorMsg.style.display = 'block';
                });

                // Recording functionality
                function toggleRecord() {
                    if (!currentStation || !isPlaying) {
                        alert("Please play a station first to record!");
                        return;
                    }

                    if (isRecording) {
                        stopRecording();
                    } else {
                        startRecording();
                    }
                }

                function startRecording() {
                    try {
                        // Try capturing the stream. May fail due to CORS restrictions on cross-origin audio.
                        const stream = audio.captureStream ? audio.captureStream() : (audio.mozCaptureStream ? audio.mozCaptureStream() : null);
                
                        if (!stream) {
                            alert("Recording is not supported in this browser.");
                            return;
                        }

                        mediaRecorder = new MediaRecorder(stream);
                
                        mediaRecorder.ondataavailable = function(e) {
                            if (e.data.size > 0) {
                                recordedChunks.push(e.data);
                            }
                        };
                
                        mediaRecorder.onstop = function() {
                            const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.style.display = 'none';
                            a.href = url;
                            a.download = `${currentStation.name.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_recording.webm`;
                            document.body.appendChild(a);
                            a.click();
                            window.URL.revokeObjectURL(url);
                            recordedChunks = [];
                        };

                        mediaRecorder.start();
                        isRecording = true;
                        recordBtn.classList.add('recording');
                
                    } catch (err) {
                        console.error("Recording error:", err);
                        alert("Cannot record this stream due to browser cross-origin (CORS) restrictions on remote audio streams.");
                    }
                }

                function stopRecording() {
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop();
                    }
                    isRecording = false;
                    recordBtn.classList.remove('recording');
                }

            </script>
</body>
