<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Radio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #e0e5ec;
            --text-color: #4a5568;
            --text-light: #a0aec0;
            --accent-color: #6b46c1;
            
            /* Neumorphic Shadows */
            --shadow-outer: 9px 9px 16px rgba(163, 177, 198, 0.6), 
                            -9px -9px 16px rgba(255, 255, 255, 0.5);
            --shadow-inner: inset 6px 6px 10px 0 rgba(163, 177, 198, 0.7), 
                            inset -6px -6px 10px 0 rgba(255, 255, 255, 0.8);
            --shadow-hover: 4px 4px 8px rgba(163, 177, 198, 0.6), 
                            -4px -4px 8px rgba(255, 255, 255, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--bg-color);
            border-radius: 30px;
            box-shadow: var(--shadow-outer);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Search Section */
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-color);
            border-radius: 20px;
            box-shadow: var(--shadow-inner);
            padding: 5px 15px;
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px;
            font-size: 14px;
            color: var(--text-color);
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--text-light);
        }

        .search-box button {
            background: transparent;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: 10px;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .search-box button:hover {
            color: var(--accent-color);
        }

        /* Results Section */
        .results-container {
            height: 200px;
            overflow-y: auto;
            border-radius: 15px;
            padding: 10px;
            box-shadow: var(--shadow-inner);
        }

        /* Custom Scrollbar */
        .results-container::-webkit-scrollbar {
            width: 6px;
        }
        .results-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .results-container::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 10px;
        }

        .station-item {
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .station-item:hover {
            box-shadow: var(--shadow-hover);
        }

        .station-item.active {
            box-shadow: var(--shadow-inner);
            color: var(--accent-color);
            font-weight: 600;
        }

        .station-icon {
            font-size: 14px;
            color: var(--accent-color);
        }

        .station-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .station-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .station-tags {
            font-size: 11px;
            color: var(--text-light);
        }

        /* Player Section */
        .player-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding-top: 10px;
        }

        .now-playing {
            text-align: center;
            width: 100%;
        }

        .now-playing h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing p {
            font-size: 12px;
            color: var(--text-light);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        .btn {
            background-color: var(--bg-color);
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--text-color);
            box-shadow: var(--shadow-outer);
            transition: all 0.2s ease;
            outline: none;
        }

        .btn:active {
            box-shadow: var(--shadow-inner);
        }

        .btn-play {
            width: 70px;
            height: 70px;
            font-size: 24px;
            color: var(--accent-color);
        }

        .btn-play.playing {
            box-shadow: var(--shadow-inner);
        }

        /* Volume Control */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            padding: 0 10px;
        }

        .volume-container i {
            color: var(--text-light);
            font-size: 14px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(107, 70, 193, 0.4);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: var(--bg-color);
            border-radius: 5px;
            box-shadow: var(--shadow-inner);
        }

        /* Loading Animation */
        .loader {
            display: none;
            border: 3px solid var(--bg-color);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            color: #e53e3e;
            font-size: 12px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for a radio station..." onkeypress="handleKeyPress(event)">
            <button onclick="searchStations()">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <div class="results-container" id="resultsContainer">
            <div style="text-align: center; color: var(--text-light); padding-top: 70px; font-size: 14px;">
                Search to find stations globally
            </div>
        </div>

        <div class="player-section">
            <div class="now-playing">
                <h3 id="stationTitle">No Station Selected</h3>
                <p id="stationStatus">Ready to play</p>
            </div>
            
            <p class="error-msg" id="errorMsg">Failed to load stream. Try another station.</p>

            <div class="controls">
                <div class="loader" id="loader"></div>
                <button class="btn btn-play" id="playBtn" onclick="togglePlay()">
                    <i class="fas fa-play" id="playIcon"></i>
                </button>
            </div>

            <div class="volume-container">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.5" onchange="setVolume(this.value)">
                <i class="fas fa-volume-up"></i>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="none"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const stationTitle = document.getElementById('stationTitle');
        const stationStatus = document.getElementById('stationStatus');
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('errorMsg');
        
        let isPlaying = false;
        let currentStation = null;

        // Set initial volume
        audio.volume = 0.5;

        // API Endpoint for Radio Browser
        const API_BASE = 'https://de1.api.radio-browser.info/json/stations/search?limit=15&hidebroken=true&name=';

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                searchStations();
            }
        }

        async function searchStations() {
            const query = searchInput.value.trim();
            if (!query) return;

            resultsContainer.innerHTML = '<div style="text-align: center; color: var(--text-light); padding-top: 70px; font-size: 14px;">Searching...</div>';

            try {
                const response = await fetch(API_BASE + encodeURIComponent(query));
                const data = await response.json();

                if (data.length === 0) {
                    resultsContainer.innerHTML = '<div style="text-align: center; color: var(--text-light); padding-top: 70px; font-size: 14px;">No stations found.</div>';
                    return;
                }

                resultsContainer.innerHTML = '';
                data.forEach(station => {
                    const div = document.createElement('div');
                    div.className = 'station-item';
                    
                    const tags = station.tags ? station.tags.split(',').slice(0, 2).join(', ') : 'Web Radio';
                    
                    div.innerHTML = `
                        <div class="station-icon"><i class="fas fa-broadcast-tower"></i></div>
                        <div class="station-info">
                            <span class="station-name">${station.name}</span>
                            <span class="station-tags">${station.country || 'Unknown'} • ${tags}</span>
                        </div>
                    `;
                    
                    div.onclick = () => loadAndPlayStation(station, div);
                    resultsContainer.appendChild(div);
                });

            } catch (error) {
                resultsContainer.innerHTML = '<div style="text-align: center; color: #e53e3e; padding-top: 70px; font-size: 14px;">Error fetching stations.</div>';
            }
        }

        function loadAndPlayStation(station, element) {
            // Update active state in UI
            document.querySelectorAll('.station-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            currentStation = station;
            stationTitle.textContent = station.name;
            errorMsg.style.display = 'none';
            
            // Set audio source
            audio.src = station.url_resolved;
            
            playAudio();
        }

        function togglePlay() {
            if (!currentStation && !audio.src) {
                alert("Please select a radio station first!");
                return;
            }

            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        }

        function playAudio() {
            stationStatus.textContent = "Buffering...";
            playIcon.style.display = 'none';
            loader.style.display = 'block';
            
            audio.play().then(() => {
                isPlaying = true;
                playIcon.className = 'fas fa-pause';
                playIcon.style.display = 'block';
                loader.style.display = 'none';
                playBtn.classList.add('playing');
                stationStatus.textContent = "Now Playing";
                errorMsg.style.display = 'none';
            }).catch(error => {
                console.error("Playback failed", error);
                isPlaying = false;
                playIcon.className = 'fas fa-play';
                playIcon.style.display = 'block';
                loader.style.display = 'none';
                playBtn.classList.remove('playing');
                stationStatus.textContent = "Error";
                errorMsg.style.display = 'block';
            });
        }

        function pauseAudio() {
            audio.pause();
            isPlaying = false;
            playIcon.className = 'fas fa-play';
            playBtn.classList.remove('playing');
            stationStatus.textContent = "Paused";
        }

        function setVolume(val) {
            audio.volume = val;
        }

        // Handle stream ending or errors abruptly
        audio.addEventListener('error', () => {
            pauseAudio();
            stationStatus.textContent = "Stream Offline";
            errorMsg.style.display = 'block';
        });

    </script>
</body>
</html>
